name: Seed tests

# Focused regression pipeline for the advanced transfer seed feature:
# codec/security tests, handler-level seed tests, vet and a full build.
on:
  pull_request:
    paths:
      - "pkg/torrent/**"
      - "server/handles/torrent*.go"
      - "internal/fs/seed_generate.go"
      - "internal/driver/seed_stream.go"
      - "drivers/*/seed_rapid.go"
      - ".github/workflows/seed-tests.yml"
  push:
    branches:
      - main
      - feat/advanced-transfer-seeds
    paths:
      - "pkg/torrent/**"
      - "server/handles/torrent*.go"
      - "internal/fs/seed_generate.go"
      - "internal/driver/seed_stream.go"
      - "drivers/*/seed_rapid.go"
      - ".github/workflows/seed-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seed-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go-seed-tests:
    name: Go seed tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.27.1"
          cache: true
          cache-dependency-path: go.sum

      - name: Test torrent codec and security
        run: go test ./pkg/torrent/... -count=1 -race -shuffle=on

      - name: Test seed handlers
        run: go test ./server/handles/ -run 'Seed|Torrent' -count=1 -v

      - name: Vet seed packages
        run: go vet ./pkg/torrent/... ./server/handles/

      - name: Build backend
        run: go build ./...
