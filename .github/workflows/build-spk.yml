name: 自动打包构建 SPK
run-name: 📦 构建 OpenList SPK ${{ github.ref_name }}

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      version:
        description: 'OpenList 版本号 (如 4.2.9)'
        required: true
        default: '4.2.9'

permissions:
  contents: write

jobs:
  build:
    name: 📦 构建 ${{ matrix.arch }} SPK
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          # AMD64 — DS224+, DS920+, DS1522+ 等
          - arch: x64
            asset_name: openlist-linux-amd64.tar.gz
          # ARM64 — DS423+, DS623slim 等
          - arch: arm64
            asset_name: openlist-linux-arm64.tar.gz

    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v4

      - name: 🔖 提取版本号
        id: version
        run: |
          HAS_VERSION=false
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            # 从 tag 提取: refs/tags/v4.2.9 → v4.2.9
            TAG_NAME="${GITHUB_REF#refs/tags/}"
            HAS_VERSION=true
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # 手动触发
            TAG_NAME="v${{ github.event.inputs.version }}"
            HAS_VERSION=true
          else
            # 从 commit message 提取 v* 版本号
            COMMIT_MSG="${{ github.event.head_commit.message }}"
            TAG_NAME=$(echo "$COMMIT_MSG" | grep -oiE 'v[0-9]+\.[0-9]+(\.[0-9]+)?' | head -1 || true)
            if [ -n "$TAG_NAME" ]; then
              HAS_VERSION=true
            fi
          fi

          if [ "$HAS_VERSION" = true ]; then
            VERSION="${TAG_NAME#v}"
            echo "tag=$TAG_NAME" >> $GITHUB_OUTPUT
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            echo "has_version=true" >> $GITHUB_OUTPUT
            echo "✅ 检测到版本号: $TAG_NAME"
          else
            echo "version=" >> $GITHUB_OUTPUT
            echo "has_version=false" >> $GITHUB_OUTPUT
            echo "ℹ️ 未检测到版本号，跳过发布"
          fi

      - name: ⏭️ 跳过（无版本号）
        if: steps.version.outputs.has_version != 'true'
        run: echo "未检测到版本号，跳过构建"

      - name: 📥 下载 OpenList 二进制
        if: steps.version.outputs.has_version == 'true'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          ASSET="${{ matrix.asset_name }}"

          echo "正在下载 $ASSET (OpenList v${VERSION})..."

          DOWNLOAD_URL=$(curl -sL \
            "https://api.github.com/repos/openlistteam/openlist/releases/tags/v${VERSION}" \
            | jq -r ".assets[] | select(.name == \"$ASSET\") | .browser_download_url")

          if [ -z "$DOWNLOAD_URL" ] || [ "$DOWNLOAD_URL" = "null" ]; then
            echo "❌ 在 OpenList v${VERSION} Release 中未找到 $ASSET"
            exit 1
          fi

          curl -sL "$DOWNLOAD_URL" -o openlist.tar.gz
          mkdir -p extracted
          tar xzf openlist.tar.gz -C extracted

          BINARY=$(find extracted -name "openlist" -type f | head -1)
          if [ -z "$BINARY" ]; then
            echo "❌ 压缩包中未找到 openlist 二进制文件"
            exit 1
          fi

          echo "✅ 二进制文件: $BINARY ($(du -h "$BINARY" | cut -f1))"
          chmod +x "$BINARY"
          echo "BINARY_PATH=$BINARY" >> $GITHUB_ENV

      - name: 🔨 构建 SPK
        if: steps.version.outputs.has_version == 'true'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          ARCH="${{ matrix.arch }}"

          cd "Synology SPK"
          chmod +x build-spk.sh
          ./build-spk.sh "$VERSION" "$ARCH" "$GITHUB_WORKSPACE/$BINARY_PATH"

          SPK_FILE="openlist_${ARCH}_${VERSION}.spk"
          echo "SPK_FILE=$SPK_FILE" >> $GITHUB_ENV
          ls -lh "$SPK_FILE"

      - name: 📤 上传构建产物
        if: steps.version.outputs.has_version == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: spk-${{ matrix.arch }}
          path: "Synology SPK/openlist_${{ matrix.arch }}_${{ steps.version.outputs.version }}.spk"
          retention-days: 30

      - name: 🚀 发布到 Release
        if: steps.version.outputs.has_version == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: OpenList ${{ steps.version.outputs.tag }}
          body: |
            ## OpenList ${{ steps.version.outputs.tag }} — Synology SPK

            ### 安装说明

            1. 根据你的 NAS 型号选择对应的 SPK 文件：
               - **x64** (`openlist_x64_*.spk`) — DS224+, DS920+, DS1522+ 等 Intel/AMD 型号
               - **arm64** (`openlist_arm64_*.spk`) — DS423+, DS623slim 等 ARM64 型号
            2. 在 DSM 套件中心 → 手动安装 → 上传 SPK 文件
            3. 安装完成后在应用列表找到 OpenList，点击打开

            ### 访问地址

            安装后通过 `http://<NAS-IP>:5244` 访问 OpenList Web UI

            ### 登录账号

            - **v4.2.7 及以上版本**：首次访问时通过初始化页面设置账号密码
            - **v4.2.7 以下版本**：已预置管理员账号，用户名 `admin`，密码 `admin`

            ### 功能

            - 支持多种存储（阿里云盘、OneDrive、GoogleDrive、本地存储等）
            - 文件预览（PDF、Markdown、视频、音频、Office 文档）
            - WebDAV 支持
            - 开箱即用
          files: "Synology SPK/openlist_${{ matrix.arch }}_${{ steps.version.outputs.version }}.spk"
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
