name: Foxel Driver

on:
  pull_request:
    branches: ["main"]
    paths:
      - "drivers/foxel/**"
      - "drivers/all.go"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/foxel_driver.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.27.1"
      - name: Check formatting
        run: |
          gofmt -d drivers/foxel
          test -z "$(gofmt -l drivers/foxel)"
      - name: Test
        run: go test -race ./drivers/foxel
      - name: Vet
        run: go vet ./drivers/foxel
      - name: Build driver registry
        run: go build ./drivers
