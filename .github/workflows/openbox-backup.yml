name: Open-Box Backup Supabase

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Check secrets
        id: check
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "SUPABASE_DB_URL not set — skip"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install pg_dump
        if: steps.check.outputs.present == 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client

      - name: Dump
        if: steps.check.outputs.present == 'true'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          STAMP=$(date -u +%Y%m%dT%H%M%SZ)
          FILE="openbox-db-${STAMP}.sql.gz"
          pg_dump "$SUPABASE_DB_URL" --no-owner --no-acl | gzip -9 > "$FILE"
          echo "FILE=$FILE" >> "$GITHUB_ENV"
          ls -lh "$FILE"

      - uses: actions/upload-artifact@v4
        if: steps.check.outputs.present == 'true'
        with:
          name: openbox-db-backup
          path: "*.sql.gz"
          retention-days: 14

      - name: Ensure bucket + upload
        if: steps.check.outputs.present == 'true'
        env:
          REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$REF" ] || [ -z "$KEY" ]; then
            echo "Storage upload skipped (missing REF/KEY)"
            exit 0
          fi
          curl -sS -X POST "https://${REF}.supabase.co/storage/v1/bucket" \
            -H "Authorization: Bearer ${KEY}" -H "apikey: ${KEY}" \
            -H "Content-Type: application/json" \
            -d '{"id":"open-box-backups","name":"open-box-backups","public":false}' || true
          curl -sS -X POST "https://${REF}.supabase.co/storage/v1/object/open-box-backups/${FILE}" \
            -H "Authorization: Bearer ${KEY}" -H "apikey: ${KEY}" \
            -H "Content-Type: application/gzip" \
            --data-binary "@${FILE}" -w "\nHTTP %{http_code}\n"
