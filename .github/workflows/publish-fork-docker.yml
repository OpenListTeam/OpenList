name: Publish fork Docker image

on:
  push:
    branches:
      - fix/transcode-user-base-path
    paths:
      - ".github/workflows/publish-fork-docker.yml"
      - "Dockerfile"
      - "Dockerfile.ci"
      - "entrypoint.sh"
      - "build.sh"
      - "cmd/**"
      - "drivers/**"
      - "internal/**"
      - "pkg/**"
      - "server/**"
      - "go.mod"
      - "go.sum"
  workflow_dispatch:
    inputs:
      image_tag:
        description: Tag to publish in addition to pathfix
        required: true
        default: pathfix
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-fork-docker-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/openlist-pathfix

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out fork
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check build context for private values
        shell: bash
        run: |
          set -euo pipefail
          if git grep -n -I -E \
            '889999999|192\.168\.50\.100|sunhx|gho_|github_pat_|BEGIN (RSA|OPENSSH|EC) PRIVATE KEY' \
            -- ':!.git' ':!.github/workflows/publish-fork-docker.yml'; then
            echo "Potential private value found in the build context."
            exit 1
          fi

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=pathfix
            type=raw,value=${{ inputs.image_tag }},enable=${{ github.event_name == 'workflow_dispatch' && inputs.image_tag != '' && inputs.image_tag != 'pathfix' }}
            type=sha
          labels: |
            org.opencontainers.image.title=OpenList pathfix
            org.opencontainers.image.description=OpenList with transcode path normalization
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Build and publish amd64 FFmpeg image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          build-args: |
            BASE_IMAGE_TAG=ffmpeg
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
